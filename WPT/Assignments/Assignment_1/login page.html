<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            font-family: 'Arial';
        }
        body{
           background: linear-gradient(#E91E63,#F48FB1);  
        }
        #login-form-container{
            width: 450px;
            height: 450px;
            background-color:white;
            text-align: center;
            margin: 160px auto;
            border-radius: 20px;
        }
        input{
            width: 60%;
            margin-bottom: 20px;
            padding-top: 12px;
            padding-bottom: 12px;

        }
        #login-btn{
             width: 30%;
             background-color:rgba(20, 220, 203, 0.789);
             color: white;
             border: 0;
             font-size: 20px;
             cursor: pointer;
             transition: background 0.3s;
        }
        #login-btn:hover{
            background: white;
            border-style: solid;
            color: #00B8D4;
            border-width: 2px;
            border-color: rgba(20, 220, 203, 0.789);

        }
       h2{
          padding-top: 15%;
       }
       .form-field{
        border-top-width: 0;
        border-left-width: 0;
        border-right-width: 0;
        outline: 0;
       }
        
    </style>
</head>
<body>
    <div id="login-form-container">
        <h2>LOGIN</h2>
        <form>
            <div><input type="text" placeholder="Enter Username"class="form-field"></div>
            <div><input type="text" placeholder="Enter Password"class="form-field"></div>
            <div><input type="submit" id="login-btn"></div>
        </form>
        <p>Need Account?# <a href="#">Sign Up</a></p>
    </div>
</body>
</html>6
