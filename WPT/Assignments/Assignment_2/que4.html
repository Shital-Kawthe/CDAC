<!-- Que 4. Write a JavaScript program to highlight the bold words of the following paragraph, on mouse over a certain link. -->

<!DOCTYPE html>
<html>
<head>
    <title>Highlight Bold Words</title>
</head>
<body style="background-color: black; color: white;">

<h3>
    <a href="#" style="color: rgb(75, 83, 199);" onmouseover="highlightBold()">On mouse over here bold words of the following paragraph will be highlighted</a>
</h3>

<p>
    We have just <b>started</b> this section for the <b>users</b> (beginner to intermediate) who want to <b>work</b> with various <b>JavaScript</b> problems and write <b>scripts</b> online to test their JavaScript <b>skill</b>.
</p>

<script>
function highlightBold() {
    var boldWords = document.getElementsByTagName('b');
    for(var i = 0; i < boldWords.length; i++) {
        boldWords[i].style.color = "yellow";
    }
}
</script>

</body>
</html>
